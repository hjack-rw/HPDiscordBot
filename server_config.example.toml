# Copy this file to server_config.toml at the repo root and fill in your server's real IDs.
# server_config.toml is gitignored - it's never committed, since these values only
# make sense for one specific Discord server/bot application.

bot_id      = 0 # the bot's own application/user ID
dev_user_id = 0 # your (the bot owner's) personal Discord user ID
webhook_id  = 0 # webhook used for impersonation (Polyjuice Potion command)
server_id   = 0 # the Discord server (guild) this bot runs in

club_name       = "" # full community/club name, used in messages
club_name_short = "" # short form, used where space is tight

members_list_message_id = 0 # pinned message in marauders-map the member-list view edits in place

# Role IDs pinged by scheduled reminders.
[role_ids]
card_reminder = 0    # pinged for weekly free-card reminders
club_events   = 0    # pinged for Club Events / Club Points reminders
staff         = [0, 0] # pinged for staff-only reminders (Rankings, Club Points)

# Message IDs the weekly free-card reminders deep-link to (in the "charms" channel).
[card_message_ids]
card_matagot          = 0
card_book_of_monsters = 0
card_cornish_pixies   = 0

# Channel category IDs, keyed by purpose - add/remove keys to match your server.
[channel_sections_ids]
archive  = 0
team     = 0
club     = 0
tickets  = 0
general  = 0
guides   = 0
offtopic = 0

# Individual channel IDs, keyed by purpose - add/remove keys to match your server.
[channel_ids]
welcome                 = 0

secret-lab              = 0
assets                  = 0
staffroom               = 0
absence-list            = 0
points-log              = 0
the-sorting-hat         = 0

rules                   = 0
marauders-map           = 0
